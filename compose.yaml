# Deployment: a playable interactive-fiction server with the touch overlay already installed.
#
#   STORIES=/srv/if-stories docker compose up -d --build
#   -> http://localhost:8080/
#
# For the LOCAL DEV HARNESS instead (vendored hosts, bind mounts, no image build), use
# harness/docker-compose.yml. They are different things and deliberately separate.
services:
  parch-touch:
    build:
      context: .
      # WITH_PARCHMAP=0 leaves Parchmap out entirely, giving a purely MIT image (~200MB rather than
      # ~385MB) at the cost of the automatic map.
      args:
        WITH_PARCHMAP: "1"
    image: parch-touch
    ports:
      - "${PORT:-8080}:80"
    volumes:
      # Your story library. Read-only: the container only ever reads from here, and wraps copies for
      # Parchmap inside the image instead.
      - "${STORIES:-./stories}:/stories:ro"
    restart: unless-stopped
