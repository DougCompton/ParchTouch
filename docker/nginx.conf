server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DO NOT add a `types { ... }` block here. A wasm interpreter is fetched with
    # WebAssembly.instantiateStreaming, which requires exactly `application/wasm`, so it is tempting to
    # declare it — but a `types` block inside `server` REPLACES the inherited map rather than adding to
    # it, which strips the type from everything else. Doing that served index.html as
    # application/octet-stream and the browser downloaded the front page instead of rendering it.
    # nginx's own mime.types already maps wasm (line 55 in this image), so nothing is needed.

    # The mounted story library. autoindex_format json is what lets the picker list it in the browser,
    # so a game dropped into the volume shows up on reload rather than needing a restart.
    location /stories/ {
        alias /stories/;
        autoindex on;
        autoindex_format json;
        default_type application/octet-stream;   # a story file has no useful MIME type
        add_header Cache-Control "no-store";     # the library changes; never cache the listing
    }

    # The library, classified and wrapped on demand by the node helper (docker/library.mjs). This is
    # what the picker reads; nginx's /stories/ index below is its fallback if the helper is down.
    location = /library.json {
        proxy_pass http://127.0.0.1:8091;
    }

    # Wrapped copies of YOUR stories, for Parchmap's legacy core. try_files first, so a game Parchmap
    # ships or one already wrapped is served straight from disk; only a MISS reaches the helper, which
    # wraps it on the spot. `^~` is required: without it the regex location below would win and this
    # fallback would never run.
    location ^~ /parchmap/games/ {
        try_files $uri @wrapgame;
        # Generated from a mutable volume, so a static hit must not be cached either: replacing a story
        # file rewrites the wrapped copy, and a cached one would keep the old game playable indefinitely.
        add_header Cache-Control "no-store";
    }
    # No add_header here: the helper sets Cache-Control itself, on its errors as well as its hits,
    # which add_header would not cover (it applies to a fixed list of status codes). Setting it in both
    # places just emitted the header twice.
    location @wrapgame {
        proxy_pass http://127.0.0.1:8091;
    }

    # GENERATED from the mounted library, so it must not be swept up by the immutable rule below —
    # an exact-match location beats a regex one. A stale menu would hide every story you just added.
    location = /parchmap/js/GameList.js {
        add_header Cache-Control "no-store";
    }

    # The addon. Never cached, so replacing the two files takes effect on a reload.
    location /dist/ {
        add_header Cache-Control "no-store";
    }

    # The players' OWN code and engines are immutable for the life of the image. Everything generated
    # from the volume is excluded above; do not widen this to cover it.
    location ~* ^/(parchment|parchmap)/.*\.(js|css|wasm|gif|png|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
